  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <script>
    // the saved theme and font before the first paint (Auto follows the phone), so nothing flashes in the wrong colours
    (function () {
      try {
        var get = function (k) { return JSON.parse(localStorage.getItem("reader:" + k)); };
        var t = get("theme") || "auto", r = document.documentElement;
        r.dataset.theme = t === "auto" ? (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light") : t;
        r.dataset.font = get("font") || "iowan";
      } catch (e) {}
    })();
  </script>
